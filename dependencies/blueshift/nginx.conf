# Docker's embedded DNS must be queried after an API container is replaced.
# A variable upstream defers resolution to request time (and preserves the URI).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $admin_api http://blueshift-admin-api:8080;

  location /admin/ {
    proxy_pass $admin_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass $admin_api$request_uri;
  }

  location /openapi/ {
    proxy_pass $admin_api$request_uri;
  }

  location / {
    try_files $uri /index.html;
  }
}
